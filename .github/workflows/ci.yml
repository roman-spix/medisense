name: CI

# Tests run on every push (cheap Linux runner). The full macOS install check
# runs when the installer or dependencies change, or by hand: macOS runner
# minutes count 10x against a private repository's monthly allowance.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.18"
      - name: Install
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e ".[dev]"
      - name: Test
        run: .venv/bin/pytest -q
      - name: Self-check
        run: .venv/bin/medisense doctor || true

  changes:
    name: Installer changed?
    runs-on: ubuntu-latest
    outputs:
      installer: ${{ steps.diff.outputs.installer }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "installer=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          base="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then base="${{ github.event.pull_request.base.sha }}"; fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then echo "installer=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$base" HEAD | grep -qE '^(install\.sh|requirements-macos\.txt|requirements-posture-macos\.txt|pyproject\.toml|src/medisense/posture_engine\.py|\.github/workflows/ci\.yml)$'; then
            echo "installer=true" >> "$GITHUB_OUTPUT"
          else
            echo "installer=false" >> "$GITHUB_OUTPUT"
          fi

  macos:
    name: Install on ${{ matrix.label }}
    needs: changes
    if: needs.changes.outputs.installer == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            label: Intel Mac
          # Intel Mac runners are sometimes unavailable; the posture engine's
          # Apple Vision code and the installer are the same on Apple silicon.
          - runner: macos-15
            label: Apple silicon Mac
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Run install.sh exactly as a person would
        run: bash install.sh
      - name: Install the optional background posture engine too (to keep testing it)
        run: MEDISENSE_INSTALL_POSTURE_ENGINE=1 bash install.sh
      - name: Tests with the installed Python
        run: |
          ~/.medisense/bin/uv pip install --python .venv/bin/python pytest pytest-aiohttp
          .venv/bin/pytest -q
      - name: Demo mode serves live data
        run: |
          .venv/bin/medisense demo --no-browser --quiet &
          for i in $(seq 1 30); do
            sleep 1
            if curl -fs http://127.0.0.1:8765/api/status | grep -Eq '"live": ?true'; then echo "live after ${i}s"; ok=1; break; fi
          done
          kill %1 || true
          [ "${ok:-}" = 1 ]
      - name: Posture camera engine (Apple Vision) finds a body in a photo
        run: |
          test -x .venv-posture/bin/python
          .venv-posture/bin/python -I src/medisense/posture_engine.py --check
          curl -fsSL -o portrait.jpg https://storage.googleapis.com/mediapipe-assets/portrait.jpg
          echo "a6f11efaa834706db23f275b6115058fa87fc7f14362681e6abe14e82749de3e  portrait.jpg" | shasum -a 256 -c -
          .venv-posture/bin/python -I src/medisense/posture_engine.py --image portrait.jpg --frames 2 < /dev/null > pose.jsonl
          .venv/bin/python .github/check_vision_pose.py pose.jsonl tests/data/pose_upright.json
          .venv/bin/medisense fetch-assets
      - name: Posture app serves its page and state
        run: |
          MEDISENSE_POSTURE_NATIVE=0 .venv/bin/medisense posture --no-browser --quiet &
          for i in $(seq 1 30); do
            sleep 1
            if curl -fs http://127.0.0.1:8766/api/state | grep -q '"service"'; then echo "up after ${i}s"; ok=1; break; fi
          done
          curl -fs http://127.0.0.1:8766/ | grep -q "MediSense Posture"
          kill %1 || true
          [ "${ok:-}" = 1 ]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medisense"
version = "0.1.0"
description = "Contactless meditation tracking with an ESP32-S3 and RuView WiFi sensing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "aiohttp>=3.9",
    "pyserial>=3.5",
    "esptool==4.8.1",
    "esp-idf-nvs-partition-gen>=0.1.6",
    "certifi",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-aiohttp>=1.0"]

[project.scripts]
medisense = "medisense.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
medisense = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
